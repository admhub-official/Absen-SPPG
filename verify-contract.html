<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verifikasi Perjanjian Kerja · Hadirly</title><style>body{margin:0;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:0 auto;padding:32px 18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 22px 60px rgba(15,23,42,.1);overflow:hidden}.head{padding:22px;background:#eff6ff;border-top:6px solid #1d4ed8}.head h1{font-size:1.15rem;margin:0}.head p{margin:6px 0 0;color:#64748b;font-size:.82rem}.body{padding:22px}.status{display:inline-flex;padding:7px 11px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:.76rem;font-weight:900}.status.bad{background:#fef2f2;color:#b91c1c}.grid{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;margin-top:18px}.grid dt{font-size:.72rem;font-weight:800;color:#64748b}.grid dd{margin:0;font-size:.8rem;font-weight:700;overflow-wrap:anywhere}.hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.68rem;font-weight:500}.note{margin-top:18px;padding:11px;border-radius:12px;background:#f8fafc;color:#64748b;font-size:.72rem;line-height:1.5}@media(max-width:520px){.grid{grid-template-columns:1fr;gap:3px}.grid dd{margin-bottom:8px}}</style></head><body><main class="wrap"><section class="card"><div class="head"><h1>Verifikasi Perjanjian Kerja</h1><p>Validasi dokumen digital SPPG.</p></div><div class="body" id="result"><span class="status">MEMERIKSA...</span></div></section></main><script>const root=document.querySelector('#result'),token=new URLSearchParams(location.search).get('t')||'';const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>{if(!v)return'-';const d=new Date(v);return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric'}).format(d)};async function run(){try{if(token.length<30)throw new Error('Token tidak valid.');const r=await fetch('https://szwwpnbbsmjsbzzcecyj.supabase.co/functions/v1/SessionGateway',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:'EmploymentContracts',payload:{function:'verifyEmploymentContract',data:{token}}}),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});const b=await r.json().catch(()=>({}));if(!r.ok||b?.success===false)throw new Error(b?.error||b?.message||'Dokumen tidak valid.');const d=b.result;root.innerHTML=`<span class="status">PERJANJIAN TERVERIFIKASI</span><dl class="grid"><dt>Nomor</dt><dd>${esc(d.contractNumber)}</dd><dt>Karyawan</dt><dd>${esc(d.nama)}</dd><dt>SPPG</dt><dd>${esc(d.sppg)}</dd><dt>Jabatan</dt><dd>${esc(d.jabatan)}</dd><dt>Tanggal TTD</dt><dd>${esc(fmt(d.signedAt))}</dd><dt>Status</dt><dd>${esc(d.status)}</dd><dt>Versi Template</dt><dd>${esc(d.templateVersion)}</dd><dt>SHA-256 Dokumen</dt><dd class="hash">${esc(d.documentHash)}</dd></dl><div class="note">Halaman publik ini tidak menampilkan NIK, alamat, gaji, nomor rekening, atau data sensitif lainnya.</div>`;}catch(e){root.innerHTML=`<span class="status bad">TIDAK VALID</span><div class="note">${esc(e.message||'Perjanjian tidak ditemukan atau sudah tidak aktif.')}</div>`;}}run();</script></body></html>
