name: Staging Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate code and release contracts
        run: deno task ci

      - name: Verify deployable components
        shell: bash
        run: |
          test -f supabase/functions/AbsenV2/index.ts
          test -f supabase/functions/AttendanceCorrections/index.ts
          test -f supabase/functions/OperationsV2/index.ts
          test -f supabase/functions/WorkforceOps/index.ts
          test -f supabase/functions/PlatformOps/index.ts

      - name: Produce staging checklist
        run: |
          mkdir -p artifacts
          printf 'commit=%s\nstatus=validated\n' "${GITHUB_SHA}" > artifacts/staging-check.txt

      - name: Upload staging checklist
        uses: actions/upload-artifact@v4
        with:
          name: staging-validation
          path: artifacts/staging-check.txt
