name: Backend Hardening One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-hardening-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified backend hardening replacements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          did = 'supabase/functions/DigitalIdentity/index.ts'
          replace_once(did,
          '''  if (result.error || !result.data) throw new Error("ACCOUNT_INACTIVE");''',
          '''  if (result.error) throw result.error;\n  if (!result.data) throw new Error("ACCOUNT_INACTIVE");''')

          replace_once(did,
          '''  try {\n    await db.storage.from(BUCKET).remove(paths);\n  } catch (error) {''',
          '''  try {\n    const result = await db.storage.from(BUCKET).remove(paths);\n    if (result.error) throw result.error;\n  } catch (error) {''')

          replace_once(did,
          '''    const pendingAfterRace = await getCardByStatus(auth.idUser, "PENDING").catch(() => null);\n    const errorCode = (error as { code?: string })?.code;\n    if (pendingAfterRace && errorCode === "23505") {''',
          '''    const errorCode = (error as { code?: string })?.code;\n    const pendingAfterRace = errorCode === "23505"\n      ? await getCardByStatus(auth.idUser, "PENDING")\n      : null;\n    if (pendingAfterRace && errorCode === "23505") {''')

          replace_once(did,
          '''  const profile = await getProfile(String(cardResult.data.ID_User)).catch(() => null);\n  if (!profile || profile.Status_Aktif === false) return { valid: false, status: "INACTIVE" };''',
          '''  let profile: UserProfile;\n  try {\n    profile = await getProfile(String(cardResult.data.ID_User));\n  } catch (error) {\n    if (error instanceof Error && error.message === "ACCOUNT_INACTIVE") {\n      return { valid: false, status: "INACTIVE" };\n    }\n    throw error;\n  }\n  if (profile.Status_Aktif === false) return { valid: false, status: "INACTIVE" };''')

          contracts = 'supabase/functions/EmploymentContracts/index.ts'
          replace_once(contracts,
          '''  const result = await db.storage.from(BUCKET).createSignedUrl(storagePath, SIGNED_URL_SECONDS);\n  return result.data?.signedUrl || "";''',
          '''  const result = await db.storage.from(BUCKET).createSignedUrl(storagePath, SIGNED_URL_SECONDS);\n  if (result.error) throw new Error("Tautan dokumen gagal dibuat: " + result.error.message);\n  return result.data?.signedUrl || "";''')

          replace_once(contracts,
          '''  const compResult = await db.from("Master_Contract_Compensation").select("*").eq("Aktif", true).eq("ID_Master_Jabatan", job.ID_Master_Jabatan).limit(1).maybeSingle();\n  return { sppg, job, jobDescription: jobDescResult.data, hours: hoursResult.data, term: termResult.data, template: templateResult.data, compensation: compResult.data || null };''',
          '''  const compResult = await db.from("Master_Contract_Compensation").select("*").eq("Aktif", true).eq("ID_Master_Jabatan", job.ID_Master_Jabatan).limit(1).maybeSingle();\n  if (compResult.error) throw new Error("Master kompensasi gagal dibaca: " + compResult.error.message);\n  return { sppg, job, jobDescription: jobDescResult.data, hours: hoursResult.data, term: termResult.data, template: templateResult.data, compensation: compResult.data || null };''')

          deno = 'deno.json'
          replace_once(deno,
          'supabase/functions/Absen/index.ts supabase/functions/AttendanceLocation/index.ts',
          'supabase/functions/Absen/index.ts supabase/functions/AbsenV2/index.ts supabase/functions/AttendanceLocation/index.ts')

          Path('.github/workflows/backend-hardening-once.yml').unlink()
      - name: Commit hardened backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(edge): finish backend error handling hardening"
          git push origin HEAD:main
