name: Query Efficiency Followup
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply active-path query efficiency fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # OperationsV2: count-only KPI RPC instead of fetching up to 5k complaint/slip rows.
          path = Path('supabase/functions/OperationsV2/index.ts')
          src = path.read_text()
          pattern = re.compile(r'''  let complaintQuery = db\.from\("Pengaduan"\).*?  const openTickets = \(complaints\.data \|\| \[\]\)\.filter\(\(row\) =>\n    !\["SELESAI", "DITUTUP", "CLOSED", "CLOSE"\]\.includes\(normalize\(row\.Status_Tiket\)\)\n  \)\.length;''', re.S)
          replacement = '''  const dashboardCounts = await db.rpc("get_operational_dashboard_counts", {
            p_sppg: scope,
          });
          if (dashboardCounts.error) throw dashboardCounts.error;
          const countData = (dashboardCounts.data || {}) as Record<string, unknown>;
          const openTickets = Number(countData.openTickets || 0);
          const pendingRecipientSignatures = Number(countData.pendingRecipientSignatures || 0);'''
          src2, count = pattern.subn(lambda _: replacement, src)
          if count != 1: raise SystemExit(f'Operations dashboard count patch expected 1 block, found {count}')
          src2 = src2.replace('pendingRecipientSignatures: (slips.data || []).length,', 'pendingRecipientSignatures,')
          path.write_text(src2)

          # Absen public gateway: optimize active legacy audit/payroll list calls and narrow notification columns.
          path = Path('supabase/functions/Absen/proxy.ts')
          src = path.read_text()
          marker = 'function notificationMatches(notification: any, user: any) {'
          helpers = '''async function optimizedAuditLog(user: any, data: any) {
            if (!['ADMIN', 'SUPER ADMIN'].includes(user.role)) throw new Error('Akses hanya untuk ADMIN');
            const limit = Math.min(500, Math.max(1, Number(data?.limit) || 100));
            const result = await db.from('Audit_Log')
              .select('ID_Log,Waktu,ID_User_Pelaku,Jenis_Aktivitas,Detail,IP_Address')
              .order('Waktu', { ascending: false })
              .limit(limit);
            if (result.error) throw result.error;
            let logs = result.data || [];
            const filters = data?.filters || {};
            if (filters.jenisAktivitas) logs = logs.filter((row: any) => row.Jenis_Aktivitas === filters.jenisAktivitas);
            if (filters.tanggal) logs = logs.filter((row: any) => String(row.Waktu || '').slice(0, 10) === String(filters.tanggal).slice(0, 10));
            if (filters.pelaku) logs = logs.filter((row: any) => row.ID_User_Pelaku === filters.pelaku);
            const actorIds = [...new Set(logs.map((row: any) => String(row.ID_User_Pelaku || '')).filter((id: string) => id && id !== 'SYSTEM'))];
            let actors = new Map<string, any>();
            if (actorIds.length) {
              const actorRows = await db.from('Users').select('ID_User,Nama_Lengkap,Email').in('ID_User', actorIds);
              if (actorRows.error) throw actorRows.error;
              actors = new Map((actorRows.data || []).map((row: any) => [String(row.ID_User), row]));
            }
            return { logs: logs.map((row: any) => {
              const actor = actors.get(String(row.ID_User_Pelaku));
              return { ...row, _pelakuNama: actor?.Nama_Lengkap || (row.ID_User_Pelaku === 'SYSTEM' ? 'Sistem' : row.ID_User_Pelaku), _pelakuEmail: actor?.Email || '' };
            }) };
          }

          async function optimizedSlipList(user: any) {
            if (!['ADMIN', 'SUPER ADMIN', 'AKUNTAN'].includes(user.role)) throw new Error('Akses hanya untuk ADMIN atau AKUNTAN');
            const ids = user.role === 'SUPER ADMIN' ? null : await scopedUserIds(user);
            if (ids && !ids.length) return { slipGaji: [] };
            let query = db.from('Slip_Gaji')
              .select('ID_Slip,ID_Payroll,ID_User,Periode_Mulai,Periode_Akhir,Total_Gaji_Diterima,Status_Penerbitan,Diterbitkan_At,Created_At,PDF_Storage_Path,URL_PDF_Slip,SPPG')
              .order('Diterbitkan_At', { ascending: false, nullsFirst: false });
            if (ids) query = query.in('ID_User', ids);
            const slips = await query;
            if (slips.error) throw slips.error;
            const userIds = [...new Set((slips.data || []).map((row: any) => String(row.ID_User || '')).filter(Boolean))];
            let users = new Map<string, any>();
            if (userIds.length) {
              const userRows = await db.from('Users').select('ID_User,Nama_Lengkap,SPPG').in('ID_User', userIds);
              if (userRows.error) throw userRows.error;
              users = new Map((userRows.data || []).map((row: any) => [String(row.ID_User), row]));
            }
            return { slipGaji: (slips.data || []).map((row: any) => {
              const employee = users.get(String(row.ID_User));
              return { ...row, _namaKaryawan: employee?.Nama_Lengkap || row.ID_User, _sppgKaryawan: employee?.SPPG || row.SPPG || '' };
            }) };
          }

          function notificationMatches(notification: any, user: any) {'''
          if src.count(marker) != 1: raise SystemExit('proxy helper marker mismatch')
          src = src.replace(marker, helpers, 1)
          src = src.replace(".from('App_Notifications')\n    .select('*')", ".from('App_Notifications')\n    .select('ID_Notification,Title,Message,Priority,Target_Mode,Target_Roles,Target_SPPG,Target_User_IDs,Show_Banner,Play_Sound,Push_Enabled,Action_View,Starts_At,Expires_At,Created_At,Status')", 1)
          route_marker = "    if (functionName === 'getMyAbsensi') {"
          routes = '''    if (functionName === 'getAuditLogEnriched') {
              const user = await authenticate(body.data?.token);
              return json({ success: true, result: await optimizedAuditLog(user, body.data || {}), requestId }, 200, requestId);
            }
            if (functionName === 'getAllSlipGajiList') {
              const user = await authenticate(body.data?.token);
              return json({ success: true, result: await optimizedSlipList(user), requestId }, 200, requestId);
            }

            if (functionName === 'getMyAbsensi') {'''
          if src.count(route_marker) != 1: raise SystemExit('proxy route marker mismatch')
          path.write_text(src.replace(route_marker, routes, 1))

          # Extend regression test with active medium-impact paths.
          test = Path('tests/query_efficiency_contract_test.ts')
          src = test.read_text()
          src += '''\nDeno.test("active admin KPI, audit, payroll and notification paths avoid row overfetch", async () => {\n  const operations = await read("supabase/functions/OperationsV2/index.ts");\n  const proxy = await read("supabase/functions/Absen/proxy.ts");\n  const migration = await read("supabase/migrations/20260808113400_query_efficiency_active_path_followup.sql");\n  assert(operations.includes('db.rpc("get_operational_dashboard_counts"'));\n  assert(!operations.includes('.select("ID_Pengaduan,SPPG,Status_Tiket").limit(5000)'));\n  assert(proxy.includes("async function optimizedAuditLog"));\n  assert(proxy.includes("select('ID_Log,Waktu,ID_User_Pelaku,Jenis_Aktivitas,Detail,IP_Address')"));\n  assert(proxy.includes("async function optimizedSlipList"));\n  assert(proxy.includes("select('ID_User,Nama_Lengkap,SPPG')"));\n  assert(!proxy.includes(".from('App_Notifications')\\n    .select('*')"));\n  assert(migration.includes("get_operational_dashboard_counts"));\n});\n'''
          test.write_text(src)
          PY
          rm -f .github/workflows/query-efficiency-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(api): finish active query efficiency paths'
          git push
