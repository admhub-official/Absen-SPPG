name: Release 20-22 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Shared quality gate
        run: deno task check
      - name: Validate Sprint 20-22 contracts
        run: deno test -A tests/release_sprint_20_22_test.ts
      - name: Verify platform components
        run: |
          test -f supabase/functions/PlatformOps/index.ts
          test -f sw-v22.js
          test -f pwa-runtime.js
