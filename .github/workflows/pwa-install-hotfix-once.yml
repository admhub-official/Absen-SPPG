name: PWA Install Hotfix Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: contains(github.event.head_commit.message, '[pwa-install-hotfix-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch installed-app detector and validate
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          config_path = Path('supabase-config.js')
          config = config_path.read_text(encoding='utf-8')
          helper = """function isInstalledApp() {
            const displayModes = ['standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'];
            const displayModeInstalled = displayModes.some((mode) => {
              try { return window.matchMedia?.(`(display-mode: ${mode})`)?.matches === true; }
              catch { return false; }
            });
            const iosStandalone = navigator.standalone === true;
            const trustedWebActivity = String(document.referrer || '').startsWith('android-app://');
            return displayModeInstalled || iosStandalone || trustedWebActivity;
          }
          """
          if 'function isInstalledApp()' not in config:
            anchor = "});\n\n(() => {"
            if config.count(anchor) < 1:
              raise SystemExit('supabase-config insertion anchor not found')
            config = config.replace(anchor, "});\n\n" + helper + "\n(() => {", 1)
            config_path.write_text(config, encoding='utf-8')

          release = Path('src/app/release-version.js')
          source = release.read_text(encoding='utf-8')
          source = source.replace("version = '26.11.56'", "version = '26.11.57'")
          source = source.replace("cacheName = 'absen-sppg-hadirly-v97'", "cacheName = 'absen-sppg-hadirly-v98'")
          release.write_text(source, encoding='utf-8')

          for test in Path('tests').glob('*.ts'):
            source = test.read_text(encoding='utf-8')
            source = source.replace('26.11.56', '26.11.57').replace('absen-sppg-hadirly-v97', 'absen-sppg-hadirly-v98')
            test.write_text(source, encoding='utf-8')

          test_path = Path('tests/pwa_session_cache_hardening_test.ts')
          test = test_path.read_text(encoding='utf-8')
          marker = "mandatory install detector exists before inline app boot"
          if marker not in test:
            test += '''\n\nDeno.test('mandatory install detector exists before inline app boot', async () => {\n  const config = await read('supabase-config.js');\n  const index = await read('index.html');\n  for (const required of [\n    'function isInstalledApp()',\n    "'standalone', 'fullscreen', 'minimal-ui', 'window-controls-overlay'",\n    'navigator.standalone === true',\n    "startsWith('android-app://')",\n  ]) {\n    if (!config.includes(required)) throw new Error(`installed-app detector missing ${required}`);\n  }\n  if (!index.includes('if(isInstalledApp())return true;')) throw new Error('mandatory install gate must call installed-app detector');\n  const configScript = index.indexOf('<script src="supabase-config.js"></script>');\n  const inlineScript = index.indexOf('<script>', configScript);\n  if (configScript < 0 || inlineScript < 0 || configScript > inlineScript) throw new Error('supabase-config must load before inline app boot script');\n});\n'''
            test_path.write_text(test, encoding='utf-8')
          PY

          deno task ci

          rm -f .github/workflows/pwa-install-hotfix-once.yml .github/pwa-install-hotfix.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore installed PWA boot detection"
          git push origin HEAD:main
