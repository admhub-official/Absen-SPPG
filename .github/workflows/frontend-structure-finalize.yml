name: Frontend Structure Finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: frontend-structure-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.title == 'perf(frontend): finalize legacy structure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Externalize legacy shell and delegate dynamic events
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          index_path=root/'index.html'
          index=index_path.read_text(encoding='utf-8')
          if './src/legacy/index-app.js' in index:
              raise SystemExit('legacy shell already externalized')

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old,new,1)

          legacy=root/'src'/'legacy'
          legacy.mkdir(parents=True,exist_ok=True)

          style=re.search(r'<style>\s*(.*?)\s*</style>',index,re.S)
          if not style:
              raise SystemExit('inline style block not found')
          css=style.group(1).rstrip()+'\n'
          (legacy/'index-shell.css').write_text(css,encoding='utf-8')
          index=index[:style.start()]+'<link rel="stylesheet" href="./src/legacy/index-shell.css">'+index[style.end():]

          script=re.search(r'<script>\s*(const APP_CONFIG=.*?)\s*</script>\s*</body>',index,re.S)
          if not script:
              raise SystemExit('legacy inline application script not found')
          js=script.group(1).rstrip()+'\n'

          # Canvas cropper: one redraw per animation frame and no backing-store reset per pointer move.
          old='''function drawCropCanvas(){
  const canvas=$(\'#crop-canvas\');
  const ctx=canvas.getContext(\'2d\');
  const size=CropState.canvasSize;
  canvas.width=size;canvas.height=size;
  ctx.clearRect(0,0,size,size);
  const img=CropState.img;
  if(!img)return;
  const w=img.width*CropState.scale;
  const h=img.height*CropState.scale;
  const x=(size-w)/2+CropState.offsetX;
  const y=(size-h)/2+CropState.offsetY;
  ctx.drawImage(img,x,y,w,h);
}'''
          new='''let CropDrawFrame=0;
