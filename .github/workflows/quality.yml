name: Engineering Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-structure-finalize:
    if: "${{ github.event_name == 'pull_request' && github.event.pull_request.title == 'perf(frontend): finalize legacy structure' }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run asserted frontend structure transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/frontend-structure-finalize.yml').read_text(encoding='utf-8')
          start="          python3 - <<'PY'\n"
          end="\n          PY\n"
          if start not in source:
              raise SystemExit('embedded finalizer start marker missing')
          block=source.split(start,1)[1].split(end,1)[0]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code,'frontend-structure-finalizer','exec'))
          PY
          node --check src/legacy/index-app.js
          git diff --check
          test -s src/legacy/index-shell.css
          test -s src/legacy/index-app.js
          ! grep -q '<style>' index.html
          ! grep -q 'installLegacyFrontendPerformanceGuards' supabase-config.js

      - name: Commit transform to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf(frontend): externalize legacy shell and delegate events'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  deno-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Quality and release contracts
        run: deno task ci

  browser-smoke:
    needs: deno-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium smoke runtime
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local application shell
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hadirly-smoke-server.log 2>&1 &
          echo $! > /tmp/hadirly-smoke-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hadirly-smoke-server.log
          exit 1

      - name: Browser auth and navigation smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser_public_smoke.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hadirly-smoke-server.log || true

  production-readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deno-quality, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record quality-gated deployable commit
        run: |
          mkdir -p artifacts
          printf 'commit=%s\nquality=passed\nbrowser_smoke=passed\nstatus=deployable\n' "${GITHUB_SHA}" > artifacts/production-readiness.txt

      - name: Upload production readiness marker
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.sha }}
          path: artifacts/production-readiness.txt
          retention-days: 14
