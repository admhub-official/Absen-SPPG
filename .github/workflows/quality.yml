name: Engineering Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-inline-finalize:
    if: "${{ github.event_name == 'pull_request' && github.event.pull_request.title == 'refactor(ui): remove remaining static inline styles' }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply and validate zero-inline-style cleanup
        shell: bash
        run: |
          python3 tools/ui_consistency_inline_zero.py
          git checkout origin/main -- .github/workflows/quality.yml deno.lock
          git rm tools/ui_consistency_inline_zero.py
          git diff --check
          deno task ci
          git checkout origin/main -- deno.lock
          git diff --check

      - name: Commit finalized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "refactor(ui): remove remaining static inline styles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  deno-quality:
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.title != 'refactor(ui): remove remaining static inline styles' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Quality and release contracts
        run: deno task ci

  browser-smoke:
    needs: deno-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium smoke runtime
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local application shell
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hadirly-smoke-server.log 2>&1 &
          echo $! > /tmp/hadirly-smoke-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hadirly-smoke-server.log
          exit 1

      - name: Browser auth and navigation smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser_public_smoke.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hadirly-smoke-server.log || true

  production-readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deno-quality, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record quality-gated deployable commit
        run: |
          mkdir -p artifacts
          printf 'commit=%s\nquality=passed\nbrowser_smoke=passed\nstatus=deployable\n' "${GITHUB_SHA}" > artifacts/production-readiness.txt

      - name: Upload production readiness marker
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.sha }}
          path: artifacts/production-readiness.txt
          retention-days: 14
