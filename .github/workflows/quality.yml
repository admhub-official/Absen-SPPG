name: Engineering Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-consistency-finalize:
    if: "${{ github.event.pull_request.title == 'refactor(ui): unify legacy design system' }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply and validate UI consistency refactor
        shell: bash
        run: |
          python3 scripts/ui_consistency_finalize.py
          git checkout origin/main -- .github/workflows/quality.yml
          rm scripts/ui_consistency_finalize.py
          git diff --check
          deno task ci

      - name: Commit finalized source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(ui): unify legacy design system and mobile shell'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
