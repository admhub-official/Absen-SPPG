name: Engineering Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-consistency-finalize:
    if: "${{ github.event_name == 'pull_request' && github.event.pull_request.title == 'refactor(ui): unify legacy design system' }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply asserted UI consistency refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          index_path = root / 'index.html'
          shell_path = root / 'src/legacy/index-shell.css'
          tokens_path = root / 'src/styles/foundation/tokens.css'
          components_path = root / 'src/styles/foundation/components.css'
          mobile_path = root / 'src/styles/mobile-ui-refresh.css'
          responsive_path = root / 'src/styles/responsive-overrides.css'
          release_path = root / 'src/app/release-version.js'
          deno_path = root / 'deno.json'
          test_path = root / 'tests/ui_consistency_contract_test.ts'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def replace_some(text, old, new, minimum, label):
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{label}: expected at least {minimum}, found {count}')
              return text.replace(old, new)

          index = index_path.read_text(encoding='utf-8')
          shell = shell_path.read_text(encoding='utf-8')
          tokens = tokens_path.read_text(encoding='utf-8')
          components = components_path.read_text(encoding='utf-8')
          mobile = mobile_path.read_text(encoding='utf-8')
          responsive = responsive_path.read_text(encoding='utf-8')
          release = release_path.read_text(encoding='utf-8')
          deno = deno_path.read_text(encoding='utf-8')

          # Topbar: remove spacer hack, make brand text targetable, and move positioning to CSS.
          index = replace_once(index, '      <div style="flex:1"></div>\n', '', 'topbar spacer')
          brand_pattern = re.compile(r'(<div class="app-topbar-brand">\s*<img[^>]*>)\s*Presence SPPG\s*</div>')
          index, count = brand_pattern.subn(r'\1\n        <span>Presence SPPG</span>\n      </div>', index, count=1)
          if count != 1:
              raise SystemExit(f'topbar brand text: expected 1 occurrence, found {count}')
          index = replace_once(index, '<div class="app-topbar-profile-wrap" style="position:relative">', '<div class="app-topbar-profile-wrap">', 'topbar profile wrapper')

          # Replace repeated visual inline styles with reusable semantic classes.
          index = replace_once(index, '<div class="dash-card" id="dashboard-notification-card" style="margin-bottom:1.5rem">', '<div class="dash-card section-card-gap" id="dashboard-notification-card">', 'dashboard notification spacing')
          index = replace_some(index, '<div class="dash-card" style="margin-bottom:1.5rem">', '<div class="dash-card section-card-gap">', 1, 'dashboard card spacing')
          index = replace_once(index, '<div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:0.75rem">', '<div class="page-header page-header--split">', 'attendance split page header')
          index = replace_once(index, '<div class="validation-tabs" role="tablist" aria-label="Pusat validasi absensi" style="margin-bottom:.85rem">', '<div class="validation-tabs validation-tabs--spaced" role="tablist" aria-label="Pusat validasi absensi">', 'validation tabs spacing')
          index = replace_once(index, '<tr><td colspan="7" style="padding:0">', '<tr><td colspan="7" class="table-cell-flush">', 'attendance skeleton cell')
          index = replace_once(index, '<div style="display:flex;gap:.45rem;flex-wrap:wrap">\n              <button class="btn btn-sm btn-primary" type="button" data-attendance-action="VALID">', '<div class="attendance-selection-actions">\n              <button class="btn btn-sm btn-primary" type="button" data-attendance-action="VALID">', 'attendance selection actions')
          index = replace_once(index, '<button class="btn btn-sm" style="background:var(--danger);color:#fff" type="button" data-attendance-action="DITOLAK">', '<button class="btn btn-sm btn-danger" type="button" data-attendance-action="DITOLAK">', 'attendance reject button')
          index = replace_once(index, '<div class="user-filter-toolbar" style="padding:0 1rem 1rem">', '<div class="user-filter-toolbar">', 'user filter toolbar')
          index = replace_once(index, '<div style="margin-left:auto;display:flex;gap:.35rem"><button class="view-toggle active"', '<div class="view-toggle-group"><button class="view-toggle active"', 'user view toggle group')
          index = replace_some(index, 'class="form-group" style="margin:0"', 'class="form-group form-group--flush"', 2, 'flush form groups')
          index = replace_once(index, '<div style="padding:0 1rem">\n            <div class="payroll-selection-bar">', '<div class="payroll-selection-shell">\n            <div class="payroll-selection-bar">', 'payroll selection shell')
          index = replace_once(index, '<div class="feature-card"><div class="feature-toolbar" style="margin:0">', '<div class="feature-card"><div class="feature-toolbar feature-toolbar--flush">', 'complaint toolbar flush')
          index = replace_once(index, '<div class="page-header" style="margin-bottom:1rem">', '<div class="page-header page-header--compact">', 'user detail header spacing')
          index = replace_once(index, '<button class="btn" id="btn-admin-delete-user" style="background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5">', '<button class="btn btn-danger-soft" id="btn-admin-delete-user">', 'delete user button')

          # Modal variants and repeated signature/profile utilities.
          for px, cls in [('620', 'modal-card--wide'), ('520', 'modal-card--medium'), ('500', 'modal-card--narrow'), ('420', 'modal-card--compact'), ('400', 'modal-card--face')]:
              index = index.replace(f'<div class="modal-card" style="max-width:{px}px">', f'<div class="modal-card {cls}">')
          index = replace_some(index, '<span style="color:var(--danger)">*</span>', '<span class="form-required">*</span>', 3, 'required markers')
          signature_actions = '<div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-top:.55rem">'
          index = replace_some(index, signature_actions, '<div class="signature-panel-actions">', 3, 'signature action rows')
          index = index.replace('<div class="signature-legal" style="margin-top:1rem">', '<div class="signature-legal signature-legal--spaced">')
          index = index.replace('<p class="helper-text" style="margin-top:.8rem">', '<p class="helper-text helper-text--spaced">')
          index = replace_once(index, '<button class="btn" id="btn-risk-confirm" type="button" style="display:none;background:var(--danger);color:#fff">', '<button class="btn btn-danger" id="btn-risk-confirm" type="button" style="display:none">', 'risk confirm button')
          index = index.replace('<div class="form-group" style="grid-column:1/-1">', '<div class="form-group modal-grid-full">')
          index = replace_once(index, '<div style="display:flex;flex-direction:column;align-items:center;gap:0.75rem;margin-bottom:1.5rem">', '<div class="profile-photo-editor">', 'profile photo editor')
          index = replace_once(index, '<div class="profile-avatar" id="edit-profil-avatar" style="width:96px;height:96px;font-size:1.875rem;position:static">', '<div class="profile-avatar profile-avatar--editor" id="edit-profil-avatar">', 'profile editor avatar')
          index = replace_once(index, '<button type="button" class="btn btn-secondary" id="btn-ubah-foto-profil" style="font-size:0.8125rem;padding:0.5rem 1rem;display:inline-flex;align-items:center;gap:0.4rem">', '<button type="button" class="btn btn-secondary btn-sm profile-photo-button" id="btn-ubah-foto-profil">', 'profile photo button')
          index = replace_once(index, '<input type="file" id="input-foto-profil" accept="image/*" style="display:none">', '<input type="file" id="input-foto-profil" class="profile-photo-input" accept="image/*">', 'profile photo input')
          icon_style = ' style="margin-right:0.35rem;vertical-align:-2px"'
          if index.count(icon_style) < 2:
              raise SystemExit('profile button icon inline styles not found')
          index = index.replace(icon_style, '')

          # Foundation tokens: add semantic danger shades and a single mobile navigation geometry source.
          if '--ui-bottomnav-height:' not in tokens:
              tokens = replace_once(tokens, '  --ui-danger-600: #dc2626;\n', '  --ui-danger-200: #fecaca;\n  --ui-danger-600: #dc2626;\n  --ui-danger-800: #991b1b;\n', 'danger token expansion')
              tokens = replace_once(tokens, '  --ui-content-max: 90rem;\n', '  --ui-content-max: 90rem;\n  --ui-bottomnav-height: 4.25rem;\n  --ui-bottomnav-clearance: 5.125rem;\n  --ui-bottomnav-scan-size: 3.25rem;\n  --ui-bottomnav-scan-lift: 1.625rem;\n', 'bottom navigation tokens')

          # Keep the critical legacy root fallback numerically aligned with foundation aliases.
          shell, count = re.subn(
              r'^:root\{[^\n]*\}',
              ':root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-light:#eef2ff;--primary-ring:rgba(79,70,229,.18);--success:#059669;--danger:#dc2626;--warning:#f59e0b;--bg:#f8fafc;--surface:#fff;--text:#0f172a;--text-secondary:#475569;--text-muted:#64748b;--border:#e2e8f0;--radius:.625rem;--radius-lg:1rem;--shadow:0 1px 2px rgb(15 23 42/0.05);--shadow-lg:0 20px 45px rgb(15 23 42/0.16);--ui-bottomnav-height:4.25rem;--ui-bottomnav-clearance:5.125rem;--ui-bottomnav-scan-size:3.25rem;--ui-bottomnav-scan-lift:1.625rem}',
              shell,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('legacy root token block not found')
          shell = replace_once(shell, '.app-topbar-brand{display:none}', '.app-topbar-brand{display:none;min-width:0}', 'topbar brand base rule')
          shell = replace_once(shell, '.app-topbar-profile{display:flex;', '.app-topbar-profile-wrap{position:relative;flex-shrink:0}\n    .app-topbar-profile{display:flex;', 'topbar profile wrap rule')
          shell = replace_once(shell, '.notification-wrap{position:relative;margin-left:auto;margin-right:.55rem}', '.notification-wrap{position:relative;margin-left:auto;margin-right:.55rem;flex-shrink:0}', 'notification wrap rule')
          shell = replace_once(shell, '.app-topbar-brand{display:flex;align-items:center;gap:0.55rem;font-weight:700;font-size:0.9375rem;color:var(--text)}', '.app-topbar-brand{display:flex;align-items:center;gap:0.55rem;font-weight:700;font-size:0.9375rem;color:var(--text);max-width:calc(100vw - 124px)}\n      .app-topbar-brand span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}', 'mobile topbar brand rule')
          shell = replace_once(shell, '.app-content{padding:1.25rem 1rem 5.5rem}', '.app-content{padding:1.25rem 1rem var(--ui-bottomnav-clearance)}', 'mobile content clearance')
          shell = replace_once(shell, '.app-bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:80;padding:0.4rem 0.5rem calc(0.4rem + env(safe-area-inset-bottom));overflow:visible}', '.app-bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;min-height:var(--ui-bottomnav-height);background:var(--surface);border-top:1px solid var(--border);z-index:80;padding:0.4rem 0.5rem calc(0.4rem + env(safe-area-inset-bottom));overflow:visible}', 'bottomnav rule')
          shell = replace_once(shell, '.app-bottomnav-item-scan svg{background:var(--primary);color:#fff;padding:12px;border-radius:50%;width:52px;height:52px;box-shadow:0 6px 16px -3px rgba(79,70,229,.6);margin-top:-26px;box-sizing:border-box;border:4px solid var(--surface)}', '.app-bottomnav-item-scan svg{background:var(--primary);color:#fff;padding:12px;border-radius:50%;width:var(--ui-bottomnav-scan-size);height:var(--ui-bottomnav-scan-size);box-shadow:0 6px 16px -3px rgba(79,70,229,.6);margin-top:calc(-1 * var(--ui-bottomnav-scan-lift));box-sizing:border-box;border:4px solid var(--surface)}', 'scan button geometry')
          shell = replace_once(shell, '.mobile-more-menu{position:fixed;right:0.75rem;bottom:calc(76px + env(safe-area-inset-bottom));', '.mobile-more-menu{position:fixed;right:0.75rem;bottom:calc(var(--ui-bottomnav-height) + .5rem + env(safe-area-inset-bottom));', 'mobile more position')

          # Shared component variants: visual semantics live in one design-system layer.
          components = components.replace(
              '.feature-card,\n.dash-card,\n.stat-card,\n.info-section,\n.modal-card,\n.complaint-card,\n.operational-card {',
              '.feature-card,\n.dash-card,\n.stat-card,\n.info-section,\n.modal-card,\n.complaint-card,\n.operational-card,\n.admin-card,\n.profile-card,\n.user-card,\n.config-stat,\n.facecam-page-card {'
          )
          components = components.replace(
              '.badge,\n.badge-neutral,\n.badge-primary,\n.badge-count,\n.punch-chip {\n  line-height: 1;\n}',
              '.badge,\n.badge-neutral,\n.badge-primary,\n.badge-count,\n.punch-chip,\n.profile-role,\n.face-status-badge {\n  border-radius: var(--ui-radius-pill);\n  line-height: 1;\n}'
          )
          if '.btn-danger {' not in components:
              components += '''\n\n/* Shared semantic variants and layout utilities used by the legacy shell. */\n.btn-danger {\n  background: var(--ui-danger-600);\n  color: #fff;\n  border: 1px solid var(--ui-danger-600);\n}\n.btn-danger:hover { background: #b91c1c; }\n.btn-danger-soft {\n  background: var(--ui-danger-50);\n  color: var(--ui-danger-800);\n  border: 1px solid var(--ui-danger-200);\n}\n.btn-danger-soft:hover { background: #fee2e2; }\n.form-required { color: var(--ui-danger-600); }\n.section-card-gap { margin-bottom: var(--ui-space-6); }\n.page-header--split { display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:var(--ui-space-3); }\n.page-header--compact { margin-bottom: var(--ui-space-4); }\n.validation-tabs--spaced { margin-bottom: var(--ui-space-3); }\n.table-cell-flush { padding:0 !important; }\n.attendance-selection-actions { display:flex;gap:var(--ui-space-2);flex-wrap:wrap; }\n.user-filter-toolbar { padding:0 var(--ui-space-4) var(--ui-space-4); }\n.view-toggle-group { margin-left:auto;display:flex;gap:var(--ui-space-1); }\n.form-group--flush { margin:0; }\n.payroll-selection-shell { padding-inline:var(--ui-space-4); }\n.feature-toolbar--flush { margin:0; }\n.modal-card--face { max-width:25rem; }\n.modal-card--compact { max-width:26.25rem; }\n.modal-card--narrow { max-width:31.25rem; }\n.modal-card--medium { max-width:32.5rem; }\n.modal-card--wide { max-width:38.75rem; }\n.modal-grid-full { grid-column:1/-1; }\n.signature-panel-actions { display:flex;align-items:center;justify-content:space-between;gap:var(--ui-space-3);flex-wrap:wrap;margin-top:.55rem; }\n.signature-legal--spaced { margin-top:var(--ui-space-4); }\n.helper-text--spaced { margin-top:.8rem; }\n.profile-photo-editor { display:flex;flex-direction:column;align-items:center;gap:var(--ui-space-3);margin-bottom:var(--ui-space-6); }\n.profile-avatar--editor { width:6rem;height:6rem;font-size:1.875rem;position:static; }\n.profile-photo-button { display:inline-flex;align-items:center; }\n.profile-photo-input { display:none; }\n'''

          mobile = mobile.replace('padding-bottom:82px!important', 'padding-bottom:var(--ui-bottomnav-clearance)!important')
          mobile = mobile.replace('min-height:62px!important', 'min-height:var(--ui-bottomnav-height)!important')
          mobile = mobile.replace('html.mobile-ui-active .app-topbar-brand{gap:8px!important;min-width:0!important}', 'html.mobile-ui-active .app-topbar-brand{gap:8px!important;min-width:0!important;max-width:calc(100vw - 124px)!important}')
          responsive = responsive.replace('@media(max-width:720px){body{padding-bottom:70px}', '@media(max-width:720px){body{padding-bottom:var(--ui-bottomnav-height)}')
          responsive = responsive.replace('.card,.panel{scroll-margin-bottom:82px}', '.card,.panel{scroll-margin-bottom:var(--ui-bottomnav-clearance)}')

          # Regression contract for the design-system handoff and mobile shell geometry.
          test_path.write_text('''import { assert, assertEquals } from "jsr:@std/assert@1";\n\nconst read = (path: string) => Deno.readTextFile(path);\n\nDeno.test("legacy shell uses foundation-aligned visual tokens and reusable variants", async () => {\n  const [index, shell, tokens, components] = await Promise.all([\n    read("index.html"),\n    read("src/legacy/index-shell.css"),\n    read("src/styles/foundation/tokens.css"),\n    read("src/styles/foundation/components.css"),\n  ]);\n  assert(shell.startsWith(":root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-light:#eef2ff;"));\n  for (const marker of ["--success:#059669", "--danger:#dc2626", "--radius:.625rem", "--radius-lg:1rem"]) assert(shell.includes(marker));\n  for (const marker of ["--ui-danger-200", "--ui-danger-800", "--ui-bottomnav-height", "--ui-bottomnav-clearance", "--ui-bottomnav-scan-size"]) assert(tokens.includes(marker));\n  for (const marker of [".btn-danger {", ".btn-danger-soft {", ".modal-card--compact", ".signature-panel-actions", ".profile-photo-editor"]) assert(components.includes(marker));\n  assert(index.includes('<span>Presence SPPG</span>'));\n  assert(!index.includes('<div style="flex:1"></div>'));\n  assert(!index.includes('app-topbar-profile-wrap" style='));\n  assert(!/<div class="modal-card" style="max-width:(?:400|420|500|520|620)px"/.test(index));\n  assert(!index.includes('<span style="color:var(--danger)">*</span>'));\n  assert(!index.includes('style="background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5"'));\n});\n\nDeno.test("mobile topbar and bottom navigation share one responsive geometry system", async () => {\n  const [index, shell, mobile, responsive] = await Promise.all([\n    read("index.html"),\n    read("src/legacy/index-shell.css"),\n    read("src/styles/mobile-ui-refresh.css"),\n    read("src/styles/responsive-overrides.css"),\n  ]);\n  assert(shell.includes("width:var(--ui-bottomnav-scan-size);height:var(--ui-bottomnav-scan-size)"));\n  assert(shell.includes("margin-top:calc(-1 * var(--ui-bottomnav-scan-lift))"));\n  assert(shell.includes("bottom:calc(var(--ui-bottomnav-height) + .5rem + env(safe-area-inset-bottom))"));\n  assert(mobile.includes("padding-bottom:var(--ui-bottomnav-clearance)!important"));\n  assert(mobile.includes("min-height:var(--ui-bottomnav-height)!important"));\n  assert(responsive.includes("body{padding-bottom:var(--ui-bottomnav-height)"));\n  assert(responsive.includes("scroll-margin-bottom:var(--ui-bottomnav-clearance)"));\n  const scanButtons = index.match(/class="app-bottomnav-item app-bottomnav-item-scan/g) ?? [];\n  assertEquals(scanButtons.length, 2);\n});\n''', encoding='utf-8')

          if 'tests/ui_consistency_contract_test.ts' not in deno:
              occurrences = deno.count('tests/frontend_performance_structure_test.ts')
              if occurrences < 2:
                  raise SystemExit(f'deno frontend test marker: expected >=2, found {occurrences}')
              deno = deno.replace('tests/frontend_performance_structure_test.ts', 'tests/frontend_performance_structure_test.ts tests/ui_consistency_contract_test.ts')

          release = replace_once(release, "const version = '26.11.69';", "const version = '26.11.70';", 'release version')
          release = replace_once(release, "const cacheName = 'absen-sppg-hadirly-v110';", "const cacheName = 'absen-sppg-hadirly-v111';", 'release cache')

          index_path.write_text(index, encoding='utf-8')
          shell_path.write_text(shell, encoding='utf-8')
          tokens_path.write_text(tokens, encoding='utf-8')
          components_path.write_text(components, encoding='utf-8')
          mobile_path.write_text(mobile, encoding='utf-8')
          responsive_path.write_text(responsive, encoding='utf-8')
          release_path.write_text(release, encoding='utf-8')
          deno_path.write_text(deno, encoding='utf-8')
          PY

          git checkout origin/main -- .github/workflows/quality.yml
          git diff --check
          deno task ci

      - name: Commit refactor to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(ui): unify legacy design system and mobile shell'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  deno-quality:
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.title != 'refactor(ui): unify legacy design system' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Quality and release contracts
        run: deno task ci

  browser-smoke:
    needs: deno-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium smoke runtime
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local application shell
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hadirly-smoke-server.log 2>&1 &
          echo $! > /tmp/hadirly-smoke-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hadirly-smoke-server.log
          exit 1

      - name: Browser auth and navigation smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser_public_smoke.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hadirly-smoke-server.log || true

  production-readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deno-quality, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record quality-gated deployable commit
        run: |
          mkdir -p artifacts
          printf 'commit=%s\nquality=passed\nbrowser_smoke=passed\nstatus=deployable\n' "${GITHUB_SHA}" > artifacts/production-readiness.txt

      - name: Upload production readiness marker
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.sha }}
          path: artifacts/production-readiness.txt
          retention-days: 14
