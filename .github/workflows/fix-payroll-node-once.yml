name: Fix Payroll Node Once

on:
  push:
    paths:
      - '.github/workflows/fix-payroll-node-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade payroll workflow to Node 22
        shell: bash
        run: |
          set -euo pipefail
          FILE='.github/workflows/publish-payroll-100-once.yml'
          grep -q "node-version: '20'" "$FILE"
          sed -i "s/node-version: '20'/node-version: '22'/" "$FILE"
          grep -q "node-version: '22'" "$FILE"
          rm -f .github/workflows/fix-payroll-node-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: run payroll publisher on Node.js 22'
          git push
