name: Publish Payroll 100 Once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-payroll-100-once.yml'

permissions:
  contents: read

concurrency:
  group: publish-payroll-100-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL belum tersedia'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY belum tersedia'; exit 1; }

      - name: Install dependencies
        run: npm install --no-save @supabase/supabase-js@2 pdf-lib@1.17.1

      - name: Publish and verify 100 slips
        shell: bash
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');
          const { PDFDocument, StandardFonts, rgb } = require('pdf-lib');
          const crypto = require('crypto');
          const fs = require('fs');

          const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false }
          });

          const ACTOR = 'fa5c981f-dd65-4d16-afcc-db0cad8c16f1';
          const PUBLISHER = 'Hasbi Himatudin - Admin';
          const ACCOUNTANT = 'Resi Rosanti, S. Ak';
          const HEAD = 'S Abdulah Nasir, S. Ap';
          const TARGET = 100;
          const BATCH = 50;
          const startedAt = new Date();
          const uploaded = [];
          const changed = [];

          const clean = v => String(v ?? '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7e]/g, '?');
          const safe = v => clean(v).replace(/[^A-Za-z0-9._-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 80) || 'data';
          const dateOnly = v => String(v || '').split('T')[0];
          const money = v => `Rp ${Math.round(Number(v) || 0).toLocaleString('id-ID')}`;
          const textPath = v => `text://${encodeURIComponent(String(v))}`;
          const idDate = v => new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'long', year: 'numeric' }).format(new Date(`${dateOnly(v)}T00:00:00+07:00`));
          const idDateTime = v => new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(v).replace(/\./g, ':') + ' WIB';

          async function must(promise, label) {
            const result = await promise;
            if (result.error) throw new Error(`${label}: ${result.error.message}`);
            return result;
          }

          async function makePdf(s, u, issuedAt, logoBytes) {
            const doc = await PDFDocument.create();
            const page = doc.addPage([595.28, 841.89]);
            const regular = await doc.embedFont(StandardFonts.Helvetica);
            const bold = await doc.embedFont(StandardFonts.HelveticaBold);
            const logo = await doc.embedPng(logoBytes);
            const navy = rgb(.06, .12, .24);
            const muted = rgb(.36, .4, .48);
            const pale = rgb(.96, .97, .99);
            const green = rgb(.05, .45, .28);
            const L = 42, R = 553, W = R - L;

            doc.setTitle(clean(`Slip Gaji ${u.Nama_Lengkap}`));
            doc.setAuthor(PUBLISHER);
            doc.setCreationDate(issuedAt);

            const logoWidth = 68;
            const logoHeight = Math.min(68, logoWidth * logo.height / logo.width);
            page.drawImage(logo, { x: L, y: 768, width: logoWidth, height: logoHeight });
            page.drawText('SATUAN PELAYANAN PEMENUHAN GIZI (SPPG)', { x: 125, y: 806, size: 11, font: bold, color: navy });
            page.drawText(clean(u.SPPG || 'DARMARAJA').toUpperCase(), { x: 125, y: 781, size: 17, font: bold, color: navy });
            page.drawLine({ start: { x: L, y: 755 }, end: { x: R, y: 755 }, thickness: 1.2, color: navy });
            page.drawText('SLIP GAJI', { x: L, y: 721, size: 20, font: bold, color: navy });
            page.drawText(`No. ${clean(s.ID_Slip)}`, { x: L, y: 704, size: 8.5, font: regular, color: muted });
            page.drawText(`Diterbitkan: ${idDateTime(issuedAt)}`, { x: 355, y: 704, size: 8.5, font: regular, color: muted });

            page.drawRectangle({ x: L, y: 614, width: W, height: 70, color: pale });
            const info = [
              ['Nama', clean(u.Nama_Lengkap || '-')],
              ['Jabatan / Divisi', clean(u.Jabatan_Divisi || '-')],
              ['Periode', `${idDate(s.Periode_Mulai)} s.d. ${idDate(s.Periode_Akhir)}`]
            ];
            info.forEach((row, i) => {
              const y = 662 - i * 20;
              page.drawText(row[0], { x: L + 14, y, size: 9, font: bold, color: muted });
              page.drawText(':', { x: L + 112, y, size: 9, font: regular, color: muted });
              page.drawText(row[1].slice(0, 72), { x: L + 126, y, size: 10, font: regular, color: navy });
            });

            page.drawText('RINCIAN PENGHASILAN', { x: L, y: 581, size: 10, font: bold, color: navy });
            const rows = [
              ['Gaji pokok', `${money(s.Gaji_Harian)} x ${Number(s.Jumlah_Hari_Kerja) || 0} hari`, Number(s.Subtotal_Gaji) || 0],
              ['Lembur', 'Sesuai rekap', Number(s.Lembur_Nominal) || 0],
              ['Bonus / Tambahan', 'Sesuai rekap', Number(s.Bonus) || 0],
              ['Potongan', clean(s.Keterangan_Potongan || 'Tidak ada keterangan'), -(Number(s.Potongan) || 0)]
            ];
            let y = 530;
            for (const row of rows) {
              page.drawText(row[0], { x: L + 14, y, size: 10, font: bold, color: navy });
              page.drawText(String(row[1]).slice(0, 38), { x: L + 238, y, size: 9, font: regular, color: muted });
              const nominal = row[2] < 0 ? `- ${money(Math.abs(row[2]))}` : money(row[2]);
              page.drawText(nominal, { x: R - 14 - regular.widthOfTextAtSize(nominal, 9), y, size: 9, font: regular, color: navy });
              y -= 36;
            }

            page.drawRectangle({ x: L, y: 338, width: W, height: 54, color: rgb(.92, .98, .95) });
            page.drawText('TOTAL GAJI DITERIMA', { x: L + 16, y: 359, size: 11, font: bold, color: green });
            const total = money(s.Total_Gaji_Diterima);
            page.drawText(total, { x: R - 16 - bold.widthOfTextAtSize(total, 16), y: 355, size: 16, font: bold, color: green });

            const signs = [
              ['Mengetahui,', ACCOUNTANT, 'AKUNTAN'],
              ['Menyetujui,', HEAD, 'KEPALA SPPG'],
              ['Penerima,', u.Nama_Lengkap || u.ID_User, 'PENERIMA']
            ];
            const gap = 12, cell = (W - gap * 2) / 3;
            signs.forEach((q, i) => {
              const x = L + i * (cell + gap);
              page.drawText(q[0], { x, y: 278, size: 8.5, font: regular, color: navy });
              const name = clean(q[1]).slice(0, 28);
              page.drawText(name, { x: x + Math.max(0, (cell - bold.widthOfTextAtSize(name, 9)) / 2), y: 222, size: 9, font: bold, color: navy });
              page.drawLine({ start: { x, y: 210 }, end: { x: x + cell, y: 210 }, thickness: .8, color: muted });
              page.drawText(q[2], { x: x + (cell - regular.widthOfTextAtSize(q[2], 7.5)) / 2, y: 194, size: 7.5, font: regular, color: muted });
            });
            return Buffer.from(await doc.save({ useObjectStreams: false }));
          }

          async function rollback() {
            if (uploaded.length) {
              for (let i = 0; i < uploaded.length; i += 100) {
                await db.storage.from('slip-gaji').remove(uploaded.slice(i, i + 100));
              }
            }
            if (changed.length) {
              await db.from('Slip_Gaji').update({
                Status_Penerbitan: 'DRAFT', Diterbitkan_At: null, Diterbitkan_Oleh: null,
                Nama_Penerbit: 'Hasbi Himatudin/ Admin', TTD_Penerima_Path: null,
                Ditandatangani_Penerima_At: null, PDF_Storage_Path: null,
                PDF_SHA256: null, Dicetak_At: null
              }).in('ID_Slip', changed);
            }
          }

          (async () => {
            const initial = await must(db.from('Slip_Gaji').select('ID_Slip,Status_Penerbitan'), 'Status awal');
            const beforePublished = initial.data.filter(x => x.Status_Penerbitan === 'DITERBITKAN').length;
            const beforeDraft = initial.data.filter(x => x.Status_Penerbitan === 'DRAFT').length;
            if (beforePublished !== 250 || beforeDraft !== 1647) {
              throw new Error(`Kondisi awal berubah: ${beforePublished}/${beforeDraft}`);
            }

            const selected = await must(
              db.from('Slip_Gaji').select('*').eq('Status_Penerbitan', 'DRAFT')
                .order('Created_At', { ascending: true }).order('ID_Slip', { ascending: true }).limit(TARGET),
              'Memilih slip'
            );
            if (selected.data.length !== TARGET) throw new Error('Jumlah DRAFT terpilih bukan 100');
            if (selected.data.some(x => !x.ID_User)) throw new Error('Terdapat ID_User kosong pada pilihan');

            const payrollIds = [...new Set(selected.data.map(x => x.ID_Payroll))];
            const userIds = [...new Set(selected.data.map(x => x.ID_User))];
            const payrolls = await must(db.from('Payroll').select('*').in('ID_Payroll', payrollIds), 'Payroll');
            const users = await must(db.from('Users').select('ID_User,Nama_Lengkap,Jabatan_Divisi,SPPG').in('ID_User', userIds), 'Users');
            const payrollMap = new Map(payrolls.data.map(x => [String(x.ID_Payroll), x]));
            const userMap = new Map(users.data.map(x => [String(x.ID_User), x]));
            if (selected.data.some(x => !payrollMap.has(String(x.ID_Payroll)) || !userMap.has(String(x.ID_User)))) {
              throw new Error('Relasi Payroll/User tidak lengkap');
            }

            const logoResult = await db.storage.from('Logo BGN').download('LOGO_BGN.png');
            if (logoResult.error || !logoResult.data) throw new Error(`Logo gagal: ${logoResult.error?.message || 'kosong'}`);
            const logoBytes = Buffer.from(await logoResult.data.arrayBuffer());
            if (logoBytes.length < 10000 || logoBytes.length > 200000) throw new Error(`Ukuran logo tidak sesuai: ${logoBytes.length}`);

            for (let batchNo = 0; batchNo < 2; batchNo++) {
              const rows = selected.data.slice(batchNo * BATCH, (batchNo + 1) * BATCH);
              const issuedAt = new Date();
              console.log(`Batch ${batchNo + 1}: ${rows.length} slip`);
              for (const s of rows) {
                const p = payrollMap.get(String(s.ID_Payroll));
                const u = userMap.get(String(s.ID_User));
                const bytes = await makePdf(s, u, issuedAt, logoBytes);
                if (!bytes.includes(Buffer.from('/Subtype /Image'))) throw new Error(`Logo gambar tidak ditemukan: ${s.ID_Slip}`);
                const path = `${dateOnly(s.Periode_Mulai).slice(0, 4)}/${s.ID_Payroll}/${safe(u.Nama_Lengkap)}-${s.ID_Slip}.pdf`;
                const upload = await db.storage.from('slip-gaji').upload(path, bytes, { contentType: 'application/pdf', upsert: false });
                if (upload.error) throw new Error(`Upload ${s.ID_Slip}: ${upload.error.message}`);
                uploaded.push(path);
                const sha = crypto.createHash('sha256').update(bytes).digest('hex');
                const update = await db.from('Slip_Gaji').update({
                  Status_Penerbitan: 'DITERBITKAN', Diterbitkan_At: issuedAt.toISOString(),
                  Diterbitkan_Oleh: ACTOR, Nama_Penerbit: PUBLISHER,
                  TTD_Penerima_Path: textPath(u.Nama_Lengkap),
                  Ditandatangani_Penerima_At: issuedAt.toISOString(),
                  PDF_Storage_Path: path, PDF_SHA256: sha, Dicetak_At: issuedAt.toISOString()
                }).eq('ID_Slip', s.ID_Slip).eq('Status_Penerbitan', 'DRAFT').select('ID_Slip');
                if (update.error || !update.data?.length) throw new Error(`Update gagal: ${s.ID_Slip}`);
                changed.push(s.ID_Slip);
              }
            }

            for (const pid of payrollIds) {
              const remaining = await must(
                db.from('Slip_Gaji').select('ID_Slip', { count: 'exact', head: true })
                  .eq('ID_Payroll', pid).neq('Status_Penerbitan', 'DITERBITKAN'),
                `Cek Payroll ${pid}`
              );
              if ((remaining.count || 0) === 0) {
                await must(db.from('Payroll').update({
                  Status_Penerbitan: 'DITERBITKAN', Diterbitkan_At: new Date().toISOString(),
                  Diterbitkan_Oleh: ACTOR, Nama_Penerbit: PUBLISHER,
                  Nama_Akuntan: ACCOUNTANT, TTD_Akuntan_Path: textPath(ACCOUNTANT),
                  Nama_Kepala_SPPG: HEAD, TTD_Kepala_SPPG_Path: textPath(HEAD),
                  Logo_BGN_Path: 'Logo BGN/LOGO_BGN.png',
                  Tanda_Tangan_Digital_URL: textPath(PUBLISHER)
                }).eq('ID_Payroll', pid), `Update Payroll ${pid}`);
              }
            }

            const verified = await must(
              db.from('Slip_Gaji').select('ID_Slip,ID_Payroll,ID_User,Periode_Mulai,Periode_Akhir,PDF_Storage_Path,PDF_SHA256,TTD_Penerima_Path')
                .in('ID_Slip', changed),
              'Verifikasi 100 baru'
            );
            if (verified.data.length !== 100 || verified.data.some(x => !x.ID_User || !x.PDF_Storage_Path || !x.PDF_SHA256 || !x.TTD_Penerima_Path)) {
              throw new Error('Verifikasi metadata 100 slip gagal');
            }

            for (const row of verified.data) {
              const file = await db.storage.from('slip-gaji').download(row.PDF_Storage_Path);
              if (file.error || !file.data) throw new Error(`Unduh verifikasi gagal: ${row.ID_Slip}`);
              const bytes = Buffer.from(await file.data.arrayBuffer());
              if (!bytes.includes(Buffer.from('/Subtype /Image'))) throw new Error(`Objek gambar hilang: ${row.ID_Slip}`);
              const sha = crypto.createHash('sha256').update(bytes).digest('hex');
              if (sha !== row.PDF_SHA256) throw new Error(`SHA berbeda: ${row.ID_Slip}`);
            }

            const final = await must(db.from('Slip_Gaji').select('ID_Slip,Status_Penerbitan,PDF_Storage_Path,PDF_SHA256,ID_User'), 'Status akhir');
            const afterPublished = final.data.filter(x => x.Status_Penerbitan === 'DITERBITKAN').length;
            const afterDraft = final.data.filter(x => x.Status_Penerbitan === 'DRAFT').length;
            const complete = final.data.filter(x => x.Status_Penerbitan === 'DITERBITKAN' && x.PDF_Storage_Path && x.PDF_SHA256).length;
            const noUser = final.data.filter(x => !x.ID_User).length;
            if (afterPublished !== 350 || afterDraft !== 1547 || complete !== 350 || noUser !== 0) {
              throw new Error(`Target gagal: ${afterPublished}/${afterDraft}/${complete}/${noUser}`);
            }

            const distribution = {};
            for (const row of verified.data) {
              const key = `${row.ID_Payroll}|${dateOnly(row.Periode_Mulai)}|${dateOnly(row.Periode_Akhir)}`;
              distribution[key] = (distribution[key] || 0) + 1;
            }
            const report = {
              success: true,
              startedAt: startedAt.toISOString(),
              finishedAt: new Date().toISOString(),
              beforePublished, beforeDraft,
              newlyPublished: 100,
              afterPublished, afterDraft,
              publishedWithPdfAndSha: complete,
              slipsWithoutUser: noUser,
              uploadFailures: 0,
              logoImageFailures: 0,
              distribution
            };
            fs.writeFileSync('payroll-100-report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          })().catch(async error => {
            console.error(error);
            try { await rollback(); } catch (rollbackError) { console.error('ROLLBACK ERROR', rollbackError); }
            process.exit(1);
          });
          NODE

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: payroll-100-verification
          path: payroll-100-report.json
          retention-days: 7
