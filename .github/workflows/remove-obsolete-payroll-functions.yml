name: Remove Obsolete Payroll Edge Functions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-obsolete-payroll-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: szwwpnbbsmjsbzzcecyj
    steps:
      - name: Validate Supabase credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is required" >&2
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Delete obsolete payroll functions
        shell: bash
        run: |
          obsolete=(
            BulkPublishPayroll
            RebuildPayroll100
            PrepareLogoBGN
            PublishPayroll100Logo
            TrimPublishedTo100
            PublishPayroll50Logo
            PublishPayroll200Once
            PublishPayroll2000Once
            PublishPayroll100Direct
            PublishPayroll100DirectV2
            PublishPayroll100DirectV3
            PublishPayrollNext100
            PublishPayroll550
            PublishPayroll650
            PublishPayroll750
            PublishPayroll850
            RunPublishPayroll850
            RunP850B1x7k2
            RunP850B2q9m4
            VerifyPayroll850PDF
            PublishPayroll950
            RunP950B1
            RunP950B2
            VerifyPayroll950PDF
            PublishPayroll1050
            RunP1050B1
            RunP1050B2
            VerifyPayroll1050PDF
            PublishPayroll1150
            RunP1150B1
            VerifyPayroll1150PDF
            PublishPayroll1250
            RunP1250
            VerifyPayroll1250PDF
            PublishPayroll1350
            RunP1350
            VerifyPayroll1350PDF
            PublishPayroll1450
            RunP1450
            VerifyPayroll1450PDF
            PublishPayroll1550
            RunP1550
            VerifyPayroll1550PDF
            PublishPayroll1650
            RunP1650
            VerifyPayroll1650PDF
            PublishPayroll1750
            RunP1750
            VerifyPayroll1750PDF
            PublishPayrollFinal1897
            RunPFinal1897
            RunPFinal1897B2
            RunPFinal1897B3
            VerifyPayrollFinal1897PDF
            CleanupOrphanPayrollPDFs
            RunCleanupOrphanPayrollPDFs
            PayrollTTDMassal
            SyncPayrollSignatureLogo
            PendingSignatureCounts
          )

          for function_name in "${obsolete[@]}"; do
            echo "Deleting ${function_name}..."
            supabase functions delete "$function_name" --project-ref "$PROJECT_REF" --yes || true
          done

      - name: Verify obsolete functions are gone
        shell: bash
        run: |
          remaining="$(supabase functions list --project-ref "$PROJECT_REF" --output json)"
          python - <<'PY' "$remaining"
          import json, re, sys
          items = json.loads(sys.argv[1])
          names = {str(item.get("slug") or item.get("name") or "") for item in items}
          pattern = re.compile(r"^(BulkPublishPayroll|RebuildPayroll|PrepareLogoBGN|TrimPublished|PublishPayroll(?:\d|Final|Next|100Direct|50Logo|100Logo|200Once|2000Once)|RunP|RunPublishPayroll|VerifyPayroll|CleanupOrphanPayrollPDFs|RunCleanupOrphanPayrollPDFs|PayrollTTDMassal|SyncPayrollSignatureLogo|PendingSignatureCounts)")
          remaining = sorted(name for name in names if pattern.match(name))
          if remaining:
              raise SystemExit("Obsolete functions still present: " + ", ".join(remaining))
          print("All obsolete payroll functions were deleted.")
          PY
