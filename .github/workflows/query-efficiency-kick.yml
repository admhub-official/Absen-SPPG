name: Query Efficiency Kick
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  kick:
    if: startsWith(github.event.issue.title, '[query-efficiency-kick]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger one-shot patch
        run: |
          echo '# triggered by issue event' >> .github/workflows/query-efficiency-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/query-efficiency-once.yml
          git commit -m 'chore: kick query efficiency patch'
          git push
