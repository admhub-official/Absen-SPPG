name: Remove Legacy Session Loader

on:
  pull_request:
    types:
      - opened
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-session-loader
          fetch-depth: 0

      - name: Remove obsolete loader code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          loader_css_prefixes = (
              '#session-loading{',
              '#session-loading.hidden{',
              '.session-loading-logo{',
              '.session-loading-logo-icon{',
              '.session-loading-logo-icon img{',
              '.session-loading-text{',
          )
          original_lines = index.splitlines(keepends=True)
          removed_css = [line for line in original_lines if line.lstrip().startswith(loader_css_prefixes)]
          if len(removed_css) != 6:
              raise SystemExit(f'Expected 6 loader CSS rules, found {len(removed_css)}')
          index = ''.join(line for line in original_lines if not line.lstrip().startswith(loader_css_prefixes))

          loader_markup_pattern = re.compile(r'^<div id="session-loading">.*?</div>\s*$', re.MULTILINE)
          index, count = loader_markup_pattern.subn('', index, count=1)
          if count != 1:
              raise SystemExit(f'Expected one session loader element, found {count}')

          delayed_session_block = """  const hs=await checkSession();
          setTimeout(()=>{
            $('#session-loading').classList.add('hidden');
            if(hs){showApp(),loadProfilLengkap();}else{$('#auth-layout').classList.remove('hidden'),navigateTo('login');}
          },1000);
          """
          immediate_session_block = """  const hs=await checkSession();
          if(hs){showApp(),loadProfilLengkap();}else{$('#auth-layout').classList.remove('hidden'),navigateTo('login');}
          """
          if index.count(delayed_session_block) != 1:
              raise SystemExit('Delayed session verification block was not found exactly once')
          index = index.replace(delayed_session_block, immediate_session_block, 1)

          optional_hide = "  $('#session-loading')?.classList.add('hidden');\n"
          if index.count(optional_hide) != 1:
              raise SystemExit('Install-gate loader hide reference was not found exactly once')
          index = index.replace(optional_hide, '', 1)

          direct_hide = "$('#session-loading').classList.add('hidden');"
          if index.count(direct_hide) != 1:
              raise SystemExit('Config-error loader hide reference was not found exactly once')
          index = index.replace(direct_hide, '', 1)

          if 'session-loading' in index or 'Memverifikasi sesi...' in index:
              raise SystemExit('Legacy session loader references remain in index.html')
          index_path.write_text(index, encoding='utf-8')

          branding_js_path = Path('src/app/hadirly-branding.js')
          branding_js = branding_js_path.read_text(encoding='utf-8')
          old_selector = '.session-loading-logo,.auth-brand-mark,.auth-logo-mobile,.app-sidebar-brand,.app-topbar-brand'
          new_selector = '.auth-brand-mark,.auth-logo-mobile,.app-sidebar-brand,.app-topbar-brand'
          if branding_js.count(old_selector) != 1:
              raise SystemExit('Legacy loader branding selector was not found exactly once')
          branding_js_path.write_text(branding_js.replace(old_selector, new_selector, 1), encoding='utf-8')

          branding_css_path = Path('src/styles/branding/hadirly.css')
          branding_css = branding_css_path.read_text(encoding='utf-8')
          old_css_selector = 'html[data-brand="hadirly"] .session-loading-logo .hadirly-brand__text small,\n'
          if branding_css.count(old_css_selector) != 1:
              raise SystemExit('Legacy loader branding CSS selector was not found exactly once')
          branding_css_path.write_text(branding_css.replace(old_css_selector, '', 1), encoding='utf-8')

          bootstrap_path = Path('src/app/bootstrap.js')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          bootstrap, count = re.subn(r"const VERSION = '26\.11\.\d+';", "const VERSION = '26.11.22';", bootstrap, count=1)
          if count != 1:
              raise SystemExit('Frontend version constant was not updated')
          bootstrap_path.write_text(bootstrap, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw, cache_count = re.subn(r"const CACHE = 'absen-sppg-hadirly-v\d+';", "const CACHE = 'absen-sppg-hadirly-v63';", sw, count=1)
          sw, version_count = re.subn(r"const APP_VERSION = '26\.11\.\d+';", "const APP_VERSION = '26.11.22';", sw, count=1)
          if cache_count != 1 or version_count != 1:
              raise SystemExit('PWA cache/version constants were not updated')
          sw_path.write_text(sw, encoding='utf-8')
          PY

          if git grep -n "session-loading\|Memverifikasi sesi" -- index.html src; then
            echo "Legacy session loader code still exists."
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/app/hadirly-branding.js src/styles/branding/hadirly.css src/app/bootstrap.js sw.js
          git commit -m "chore: remove legacy session loader"
          git push origin HEAD:fix/remove-session-loader
