name: BFF Production Verify Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[bff-production-verify-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke-test public production routing
        shell: bash
        run: |
          set -euo pipefail

          root_status=$(curl -sS --max-time 25 -D root.headers -o root.body -w '%{http_code}' 'https://hadirly.org/?source=pwa')
          test "$root_status" = "200"
          grep -Eqi '<!doctype[[:space:]]+html|<html' root.body

          session_status=$(curl -sS --max-time 25 -D session.headers -o session.body -w '%{http_code}' 'https://hadirly.org/api/auth/session')
          test "$session_status" = "401"
          grep -Eqi '^cache-control:.*no-store' session.headers
          grep -Eqi '^content-type:[[:space:]]*application/json' session.headers
          grep -Eqi '^x-frame-options:[[:space:]]*DENY' session.headers

          python - <<'PY'
          import json
          from pathlib import Path

          body = json.loads(Path('session.body').read_text(encoding='utf-8'))
          if body.get('success') is not False or body.get('authenticated') is not False or body.get('code') != 'SESSION_MISSING':
              raise SystemExit(f'unexpected unauthenticated session response: {body!r}')

          path = Path('bff/runtime-status.json')
          status = json.loads(path.read_text(encoding='utf-8'))
          status['deploymentVerified'] = True
          status['deploymentVerificationMethod'] = 'github-actions-public-smoke-test'
          status['deploymentVerifiedAt'] = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat().replace('+00:00','Z')
          status['deploymentVerificationChecks'] = [
              'GET https://hadirly.org/?source=pwa returned 200 HTML',
              'GET https://hadirly.org/api/auth/session returned 401 SESSION_MISSING JSON',
              'BFF session response included no-store, JSON content type, and DENY framing headers',
          ]
          status['authenticatedLifecycleVerified'] = False
          status['note'] = 'Production BFF deployment and unauthenticated same-origin routing were verified by a public GitHub Actions smoke-test. Authenticated login -> refresh/session restore -> logout lifecycle remains a separate manual verification because no credentials are stored in CI.'
          path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          deno task ci

      - name: Commit verified metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bff-production-verify-once.yml .github/bff-production-verify.trigger root.headers root.body session.headers session.body
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: verify production BFF deployment"
          git push origin HEAD:main
