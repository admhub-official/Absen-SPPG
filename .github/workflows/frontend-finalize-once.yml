name: Frontend Finalize Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[frontend-finalize-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Make one-time matcher indentation-safe
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/frontend_finalize_once.py')
          s = p.read_text(encoding='utf-8')
          old = "pattern = rf'^{prefix}function\\s+{re.escape(name)}\\([^\\n]*\\)\\{{.*?^\\}}\\n'"
          new = "pattern = rf'^[ \\t]*{prefix}function\\s+{re.escape(name)}\\([^\\n]*\\)\\{{.*?^[ \\t]*\\}}\\n'"
          if old not in s:
              raise SystemExit('replace_function matcher source not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Apply frontend finalization
        run: python scripts/frontend_finalize_once.py

      - name: Run complete quality suite
        run: deno task ci

      - name: Remove one-time automation
        run: rm -f scripts/frontend_finalize_once.py .github/workflows/frontend-finalize-once.yml .github/frontend-finalize.trigger

      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: finalize frontend consolidation and cookie cutover"
          git push origin HEAD:main
