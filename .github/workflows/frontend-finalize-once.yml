name: Frontend Finalize Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[frontend-finalize-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply, validate, and publish only when green
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/frontend_finalize_once.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def replace_function(')
          end = s.index('\n\n# ---------------------------------------------------------------------------', start)
          helper = '''def replace_function(text, name, new_source, async_fn=None):
              if async_fn is True:
                  needle = f"async function {name}("
              elif async_fn is False:
                  needle = f"function {name}("
              else:
                  async_needle = f"async function {name}("
                  plain_needle = f"function {name}("
                  if async_needle in text:
                      needle = async_needle
                  elif plain_needle in text:
                      needle = plain_needle
                  else:
                      raise RuntimeError(f"function {name}: declaration not found")
              if text.count(needle) != 1:
                  raise RuntimeError(f"function {name}: expected one declaration, found {text.count(needle)}")
              pos = text.index(needle)
              line_start = text.rfind("\\n", 0, pos) + 1
              indent = text[line_start:pos]
              if indent.strip():
                  raise RuntimeError(f"function {name}: unexpected declaration prefix {indent!r}")
              brace = text.index("{", pos)
              marker = "\\n" + indent + "}"
              close = text.find(marker, brace)
              if close < 0:
                  raise RuntimeError(f"function {name}: closing boundary not found")
              end_pos = close + len(marker)
              if end_pos < len(text) and text[end_pos] == "\\n":
                  end_pos += 1
              return text[:line_start] + new_source.rstrip() + "\\n" + text[end_pos:]
          '''
          p.write_text(s[:start] + helper + s[end:], encoding='utf-8')
          PY

          set +e
          python scripts/frontend_finalize_once.py > frontend-finalize.log 2>&1
          patch_status=$?
          ci_status=99
          if [ "$patch_status" -eq 0 ]; then
            deno task ci >> frontend-finalize.log 2>&1
            ci_status=$?
          fi
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$patch_status" -ne 0 ] || [ "$ci_status" -ne 0 ]; then
            echo "patch_status=$patch_status ci_status=$ci_status" >> frontend-finalize.log
            git checkout -B automation/frontend-finalize-debug
            git add -A
            git commit -m "debug: frontend finalizer failure" || true
            git push --force origin automation/frontend-finalize-debug
            cat frontend-finalize.log
            exit 1
          fi

          rm -f scripts/frontend_finalize_once.py .github/workflows/frontend-finalize-once.yml .github/frontend-finalize.trigger frontend-finalize.log
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: finalize frontend consolidation and cookie cutover"
          git push origin HEAD:main
